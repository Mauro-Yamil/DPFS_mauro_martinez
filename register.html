<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | GreenBite</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
 <header>
        <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <h1><span class="green">Green</span><span class="bite">Bite</span></h1>
                    </div>
                    <nav class="main-nav">
                        <ul>
                            <li><a href="#" class="active">Home</a></li>
                            <li><a href="#popular-products">Productos</a></li>
                            <li><a href="#contact-section">Contacto</a></li>
                            <li><a href="login.html">Ingresar</a></li>
                            <li><a href="register.html">Registrarse</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
    </header>

    <main class="register-container">
        <div class="container">
            <div class="register-form">
                <h1>Crear una cuenta</h1>
                <p>Regístrate para una mejor experiencia de compra</p>
                
                <form id="registration-form">
                    <div class="form-group">
                        <label for="name">Nombre completo</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-register">Registrarse</button>
                    </div>
                    
                    <div class="login-link">
                        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>GreenBite</h3>
                    <p>Alimentos saludables y sustentables</p>
                </div>
                <div class="footer-section">
                    <h3>Contacto</h3>
                    <p>info@greenbite.com</p>
                    <p>+54 11 1234-5678</p>
                </div>
                <div class="footer-section">
                    <h3>Redes Sociales</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/register.js"></script>
</body>
</html>
