<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | GreenBite</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                        <h1><span class="green">Green</span><span class="bite">Bite</span></h1>
                    </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="index.html#productos">Productos</a></li>
                        <li><a href="index.html#nosotros">Nosotros</a></li>
                        <li><a href="index.html#contacto">Contacto</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <a href="register.html" class="btn-register">Registrarse</a>
                </div>
            </div>
        </div>
    </header>

    <main class="login-container">
        <div class="container">
            <div class="login-form">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa con tu cuenta de GreenBite</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                        <a href="forgot-password.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Recordarme
                        </label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-login">Ingresar</button>
                    </div>
                    
                    <div class="register-link">
                        ¿No tienes una cuenta? <a href="register.html">Regístrate</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>GreenBite</h3>
                    <p>Alimentos saludables y sustentables</p>
                </div>
                <div class="footer-section">
                    <h3>Contacto</h3>
                    <p>info@greenbite.com</p>
                    <p>+54 11 1234-5678</p>
                </div>
                <div class="footer-section">
                    <h3>Redes Sociales</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
